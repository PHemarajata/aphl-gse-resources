name: Validate

# Runs on every pull request and on pushes to main.
#
# Two gates:
#   1. data/resource.schema.json matches the taxonomy it is generated from
#   2. every record validates against the taxonomy in public/taxonomy.js
#
# There is deliberately no "the committed build artifact matches data/" gate any
# more. public/resources-data.js is not committed: it is built here, and built
# again at deploy time. That is what lets a curator open a pull request from a
# browser — with no terminal, they could never have satisfied a drift check.
#
# No `npm install` step: the build and validator are deliberately
# zero-dependency, so this runs in a few seconds.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Data build and validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The record schema is generated from the taxonomy. If someone adds a
      # vocabulary value without regenerating, curators' editors would keep
      # flagging the new value as invalid.
      - name: Record schema is in sync with the taxonomy
        run: node scripts/build-schema.mjs --check

      # Build first — the validator reads the built file, and it no longer
      # exists in the repository. A failure here means data/ itself is broken:
      # a bad filename, a duplicate id, unreadable JSON.
      - name: Build the data file from data/
        run: node scripts/build-data.mjs

      - name: Resources validate against the taxonomy
        run: node scripts/validate-resources.mjs

      # Put the human-readable validation summary straight into the PR's
      # checks tab, so a reviewer sees the result without opening logs.
      - name: Publish validation summary
        if: always()
        run: |
          if [ -f validation-reports/resource-validation-summary.md ]; then
            cat validation-reports/resource-validation-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No validation summary was produced — the build step probably failed first.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: validation-reports/
          if-no-files-found: warn
